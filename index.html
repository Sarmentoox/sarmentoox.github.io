<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Marcador</title>
  
  <!-- Configurações PWA e Manifesto -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0b1329">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Marcador">
  <link rel="icon" type="image/jpeg" href="./capa.jpg">
  <link rel="apple-touch-icon" href="./capa.jpg">

  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0b1329;
      color: #f8fafc;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .gold-gradient-text {
      background: linear-gradient(180deg, #fde047 0%, #eab308 50%, #ca8a04 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .card-panel {
      background-color: #111c3d;
      border: 1px solid rgba(234, 179, 8, 0.35);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .card-panel:active {
      transform: scale(0.97);
      border-color: #eab308;
    }

    .btn-gold {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #0b1329;
      font-weight: 800;
    }

    .btn-gold:active {
      transform: scale(0.96);
    }

    /* Esconde barras de rolagem mantendo o scroll */
    ::-webkit-scrollbar {
      width: 0px;
      background: transparent;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between max-w-md mx-auto relative overflow-x-hidden">

  <!-- ==================== TELA INICIAL (HOME) ==================== -->
  <div id="screen-home" class="flex-1 flex flex-col items-center justify-between p-6">
    <div class="w-full flex flex-col items-center mt-4">
      <!-- Brasão Circular com a Capa -->
      <div class="w-36 h-36 rounded-full border-4 border-amber-500 shadow-[0_0_25px_rgba(245,158,11,0.35)] overflow-hidden relative bg-[#0b1329] flex items-center justify-center">
        <img 
          src="./capa.jpg" 
          alt="Marcador" 
          class="w-full h-full object-cover scale-[1.42]"
          onerror="this.style.display='none'; document.getElementById('fallback-logo').style.display='flex';"
        >
        <div id="fallback-logo" class="hidden w-full h-full items-center justify-center text-amber-500 font-bold text-xl">
          Marcador
        </div>
      </div>

      <h1 class="text-4xl font-black tracking-wider mt-5 gold-gradient-text uppercase">
        MARCADOR
      </h1>
      <p class="text-[11px] tracking-[0.2em] text-amber-200/70 uppercase mt-1 font-semibold">
        Placar Oficial de Mesa &amp; Baralho
      </p>
    </div>

    <!-- Grid de Seleção de Jogos -->
    <div class="w-full grid grid-cols-2 gap-4 my-6">
      <!-- Truco -->
      <button onclick="openGame('truco')" class="card-panel rounded-2xl p-5 flex flex-col items-center justify-center transition-all">
        <div class="w-12 h-12 rounded-full bg-amber-500/15 border border-amber-500/30 flex items-center justify-center mb-3 text-amber-400">
          <i data-lucide="layers-2" class="w-6 h-6"></i>
        </div>
        <span class="text-lg font-bold text-white">Truco</span>
        <span class="text-[11px] text-slate-400 mt-1">Paulista / Mineiro</span>
      </button>

      <!-- Dominó -->
      <button onclick="openGame('domino')" class="card-panel rounded-2xl p-5 flex flex-col items-center justify-center transition-all">
        <div class="w-12 h-12 rounded-full bg-amber-500/15 border border-amber-500/30 flex items-center justify-center mb-3 text-amber-400">
          <i data-lucide="dices" class="w-6 h-6"></i>
        </div>
        <span class="text-lg font-bold text-white">Dominó</span>
        <span class="text-[11px] text-slate-400 mt-1">Pontuação Acumulativa</span>
      </button>

      <!-- Cacheta -->
      <button onclick="openGame('cacheta')" class="card-panel rounded-2xl p-5 flex flex-col items-center justify-center transition-all">
        <div class="w-12 h-12 rounded-full bg-amber-500/15 border border-amber-500/30 flex items-center justify-center mb-3 text-amber-400">
          <i data-lucide="heart-pulse" class="w-6 h-6"></i>
        </div>
        <span class="text-lg font-bold text-white">Cacheta</span>
        <span class="text-[11px] text-slate-400 mt-1">Vidas e Compras</span>
      </button>

      <!-- Canastra -->
      <button onclick="openGame('canastra')" class="card-panel rounded-2xl p-5 flex flex-col items-center justify-center transition-all">
        <div class="w-12 h-12 rounded-full bg-amber-500/15 border border-amber-500/30 flex items-center justify-center mb-3 text-amber-400">
          <i data-lucide="layers" class="w-6 h-6"></i>
        </div>
        <span class="text-lg font-bold text-white">Canastra</span>
        <span class="text-[11px] text-slate-400 mt-1">Modo Simplificado</span>
      </button>
    </div>

    <!-- Rodapé Discreto -->
    <div class="w-full text-center pb-2">
      <p class="text-[11px] text-slate-500">Marcador • Salvamento Automático Offline</p>
    </div>
  </div>

  <!-- ==================== TELA 1: TRUCO ==================== -->
  <div id="screen-truco" class="hidden flex-1 flex flex-col p-4">
    <div class="flex items-center justify-between border-b border-amber-500/20 pb-3 mb-4">
      <button onclick="goHome()" class="p-2 rounded-xl bg-slate-800/80 text-amber-400">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
      </button>
      <div class="text-center">
        <h2 class="text-lg font-black text-amber-400 uppercase tracking-wide">Marcador • Truco</h2>
        <span class="text-xs text-slate-400">Partida até 12 tentos</span>
      </div>
      <button onclick="resetTruco()" class="p-2 rounded-xl bg-slate-800/80 text-rose-400" title="Zerar Partida">
        <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
      </button>
    </div>

    <!-- Placar de Quedas -->
    <div class="card-panel rounded-xl p-3 mb-4 flex justify-around items-center text-center">
      <div>
        <span class="text-[10px] uppercase text-slate-400 block">Quedas Nós</span>
        <span id="truco-quedas-nos" class="text-xl font-black text-amber-400">0</span>
      </div>
      <div class="h-8 w-[1px] bg-amber-500/20"></div>
      <div>
        <span class="text-[10px] uppercase text-slate-400 block">Quedas Eles</span>
        <span id="truco-quedas-eles" class="text-xl font-black text-amber-400">0</span>
      </div>
    </div>

    <!-- Colunas Nós x Eles -->
    <div class="grid grid-cols-2 gap-3 flex-1">
      <!-- NÓS -->
      <div class="card-panel rounded-2xl p-4 flex flex-col items-center justify-between">
        <input id="truco-name-nos" type="text" value="NÓS" onchange="saveState()" class="bg-transparent text-center font-bold text-amber-400 uppercase tracking-wider w-full focus:outline-none border-b border-transparent focus:border-amber-500">
        
        <div id="truco-score-nos" class="text-7xl font-black text-white my-4">0</div>

        <div class="w-full space-y-2">
          <div class="grid grid-cols-2 gap-2">
            <button onclick="addTruco('nos', -1)" class="py-3 rounded-xl bg-slate-800 text-rose-400 font-bold text-lg active:scale-95">-1</button>
            <button onclick="addTruco('nos', 1)" class="py-3 rounded-xl btn-gold text-lg">+1</button>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <button onclick="addTruco('nos', 3)" class="py-2.5 rounded-xl bg-amber-500/20 border border-amber-500/40 text-amber-300 font-bold text-sm active:scale-95">+3 Truco</button>
            <button onclick="addTruco('nos', 6)" class="py-2.5 rounded-xl bg-amber-500/20 border border-amber-500/40 text-amber-300 font-bold text-sm active:scale-95">+6 Seis</button>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <button onclick="addTruco('nos', 9)" class="py-2.5 rounded-xl bg-amber-500/20 border border-amber-500/40 text-amber-300 font-bold text-sm active:scale-95">+9 Nove</button>
            <button onclick="addTruco('nos', 12)" class="py-2.5 rounded-xl bg-amber-500/20 border border-amber-500/40 text-amber-300 font-bold text-sm active:scale-95">+12 Doze</button>
          </div>
        </div>
      </div>

      <!-- ELES -->
      <div class="card-panel rounded-2xl p-4 flex flex-col items-center justify-between">
        <input id="truco-name-eles" type="text" value="ELES" onchange="saveState()" class="bg-transparent text-center font-bold text-amber-400 uppercase tracking-wider w-full focus:outline-none border-b border-transparent focus:border-amber-500">
        
        <div id="truco-score-eles" class="text-7xl font-black text-white my-4">0</div>

        <div class="w-full space-y-2">
          <div class="grid grid-cols-2 gap-2">
            <button onclick="addTruco('eles', -1)" class="py-3 rounded-xl bg-slate-800 text-rose-400 font-bold text-lg active:scale-95">-1</button>
            <button onclick="addTruco('eles', 1)" class="py-3 rounded-xl btn-gold text-lg">+1</button>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <button onclick="addTruco('eles', 3)" class="py-2.5 rounded-xl bg-amber-500/20 border border-amber-500/40 text-amber-300 font-bold text-sm active:scale-95">+3 Truco</button>
            <button onclick="addTruco('eles', 6)" class="py-2.5 rounded-xl bg-amber-500/20 border border-amber-500/40 text-amber-300 font-bold text-sm active:scale-95">+6 Seis</button>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <button onclick="addTruco('eles', 9)" class="py-2.5 rounded-xl bg-amber-500/20 border border-amber-500/40 text-amber-300 font-bold text-sm active:scale-95">+9 Nove</button>
            <button onclick="addTruco('eles', 12)" class="py-2.5 rounded-xl bg-amber-500/20 border border-amber-500/40 text-amber-300 font-bold text-sm active:scale-95">+12 Doze</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== TELA 2: DOMINÓ ==================== -->
  <div id="screen-domino" class="hidden flex-1 flex flex-col p-4">
    <div class="flex items-center justify-between border-b border-amber-500/20 pb-3 mb-4">
      <button onclick="goHome()" class="p-2 rounded-xl bg-slate-800/80 text-amber-400">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
      </button>
      <div class="text-center">
        <h2 class="text-lg font-black text-amber-400 uppercase tracking-wide">Marcador • Dominó</h2>
        <span class="text-xs text-slate-400">Pontuação Acumulativa</span>
      </div>
      <button onclick="resetSimpleGame('domino')" class="p-2 rounded-xl bg-slate-800/80 text-rose-400">
        <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
      </button>
    </div>

    <!-- Placar Geral Dominó -->
    <div class="grid grid-cols-2 gap-3 mb-4">
      <div class="card-panel rounded-2xl p-4 text-center">
        <input id="domino-name-a" type="text" value="Dupla A" onchange="saveState()" class="bg-transparent text-center font-bold text-amber-400 text-sm w-full focus:outline-none">
        <div id="domino-total-a" class="text-5xl font-black text-white my-2">0</div>
      </div>
      <div class="card-panel rounded-2xl p-4 text-center">
        <input id="domino-name-b" type="text" value="Dupla B" onchange="saveState()" class="bg-transparent text-center font-bold text-amber-400 text-sm w-full focus:outline-none">
        <div id="domino-total-b" class="text-5xl font-black text-white my-2">0</div>
      </div>
    </div>

    <!-- Adicionar Rodada -->
    <div class="card-panel rounded-2xl p-4 mb-4">
      <p class="text-xs text-slate-400 uppercase font-bold mb-2 text-center">Lançar Pontos da Rodada</p>
      <div class="grid grid-cols-2 gap-3">
        <div class="flex gap-2">
